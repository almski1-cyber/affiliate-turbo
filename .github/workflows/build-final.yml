name: Finaler AAB-Build
on: [push, workflow_dispatch]
jobs:
  bauen:
    läuft-auf: ubuntu-latest
    Schritte:
      - verwendet: actions/checkout@v4
      - verwendet: actions/setup-node@v4
        mit:
          Node-Version: 18
      - verwendet: actions/setup-java@v4
        mit:
          Java-Version: 17
          Verteilung: Temurin
      - Ausführen: npm install
      - Ausführen: mkdir -p www && cp index.html www/ && ls www/
      - Ausführen: rm -rf android
      - Ausführen: npx cap add android
      - Ausführen: npx cap sync
      - Ausführen: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - verwendet: actions/upload-artifact@v4
        mit:
          Name: AffiliateTurbo-APK
          Pfad: android/app/build/outputs/apk/debug/*.apk
